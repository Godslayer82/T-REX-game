<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>T-Rex Runner</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #f7f7f7;
        font-family: Arial, sans-serif;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 300px;
        border-bottom: 4px solid #333;
        overflow: hidden;
        background: white;
    }

    #dino {
        position: absolute;
        bottom: 0;
        left: 50px;
        width: 50px;
        height: 50px;
        background: #333;
        border-radius: 10px;
    }

    .cactus {
        position: absolute;
        bottom: 0;
        width: 25px;
        height: 50px;
        background: green;
        border-radius: 4px;
    }

    #score {
        position: absolute;
        top: 20px;
        right: 20px;
        font-size: 24px;
        color: #333;
    }

    #highscore {
        position: absolute;
        top: 55px;
        right: 20px;
        font-size: 20px;
        color: #666;
    }

    #gameOver {
        position: absolute;
        width: 100%;
        text-align: center;
        top: 100px;
        font-size: 40px;
        color: red;
        display: none;
        font-weight: bold;
    }

    #controls {
        position: absolute;
        bottom: 10px;
        left: 10px;
        color: #666;
        font-size: 14px;
    }
</style>
</head>

<body>

<div id="game">
    <div id="dino"></div>
    <div id="score">Score: 0</div>
    <div id="highscore">High Score: 0</div>

    <div id="gameOver">
        GAME OVER<br>
        Press SPACE to Restart
    </div>

    <div id="controls">
        SPACE = Jump
    </div>
</div>

<script>
/* =========================
   AUDIO SYSTEM
========================= */

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, duration, type = "square", volume = 0.05) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.value = volume;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration
    );

    osc.stop(audioCtx.currentTime + duration);
}

function jumpSound() {
    playTone(500, 0.1, "square", 0.06);
}

function scoreSound() {
    playTone(800, 0.08, "triangle", 0.05);
}

function gameOverSound() {
    playTone(300, 0.3, "sawtooth", 0.07);

    setTimeout(() => {
        playTone(150, 0.4, "sawtooth", 0.07);
    }, 120);
}

/* =========================
   BACKGROUND MUSIC
========================= */

let musicInterval;

function startMusic() {

    if (musicInterval) return;

    const notes = [
        262, 330, 392, 330,
        262, 330, 440, 392
    ];

    let index = 0;

    musicInterval = setInterval(() => {

        if (!gameRunning) return;

        playTone(notes[index], 0.12, "triangle", 0.02);

        index++;

        if (index >= notes.length) {
            index = 0;
        }

    }, 250);
}

function stopMusic() {
    clearInterval(musicInterval);
    musicInterval = null;
}

/* =========================
   GAME VARIABLES
========================= */

const dino = document.getElementById("dino");
const game = document.getElementById("game");
const scoreDisplay = document.getElementById("score");
const highscoreDisplay = document.getElementById("highscore");
const gameOverText = document.getElementById("gameOver");

let jumping = false;
let velocity = 0;
let gravity = 1;
let position = 0;

let gameRunning = true;
let score = 0;
let gameStarted = false;

// HIGH SCORE
let highscore = localStorage.getItem("highscore") || 0;
highscoreDisplay.innerText = "High Score: " + highscore;

/* =========================
   JUMP FUNCTION
========================= */

function jump() {

    if (jumping || !gameRunning) return;

    jumping = true;
    velocity = 18;

    jumpSound();
}

/* =========================
   CONTROLS
========================= */

document.addEventListener("keydown", (e) => {

    if (e.code === "Space") {

        if (!gameStarted) {
            audioCtx.resume();
            startMusic();
            gameStarted = true;
        }

        if (!gameRunning) {
            restartGame();
        } else {
            jump();
        }
    }
});

/* =========================
   DINO PHYSICS
========================= */

function updateDino() {

    velocity -= gravity;
    position += velocity;

    if (position <= 0) {
        position = 0;
        jumping = false;
    }

    dino.style.bottom = position + "px";
}

/* =========================
   CREATE CACTUS
========================= */

function createCactus() {

    if (!gameRunning) return;

    const cactus = document.createElement("div");
    cactus.classList.add("cactus");

    let cactusX = window.innerWidth;

    cactus.style.left = cactusX + "px";

    game.appendChild(cactus);

    const moveInterval = setInterval(() => {

        if (!gameRunning) {
            clearInterval(moveInterval);
            cactus.remove();
            return;
        }

        cactusX -= 8;
        cactus.style.left = cactusX + "px";

        const dinoRect = dino.getBoundingClientRect();
        const cactusRect = cactus.getBoundingClientRect();

        // COLLISION
        if (
            dinoRect.right > cactusRect.left &&
            dinoRect.left < cactusRect.right &&
            dinoRect.bottom > cactusRect.top
        ) {
            gameOver();
        }

        // SCORE
        if (cactusX < -50) {

            cactus.remove();
            clearInterval(moveInterval);

            score++;

            scoreDisplay.innerText = "Score: " + score;

            // SAVE HIGH SCORE
            if (score > highscore) {
                highscore = score;

                localStorage.setItem("highscore", highscore);

                highscoreDisplay.innerText =
                    "High Score: " + highscore;
            }

            scoreSound();
        }

    }, 20);

    const nextSpawn = Math.random() * 2000 + 1000;

    setTimeout(createCactus, nextSpawn);
}

/* =========================
   GAME OVER
========================= */

function gameOver() {

    gameRunning = false;

    gameOverText.style.display = "block";

    stopMusic();

    gameOverSound();
}

/* =========================
   RESTART GAME
========================= */

function restartGame() {

    document.querySelectorAll(".cactus").forEach(c => c.remove());

           score = 0;
    scoreDisplay.innerText = "Score: 0";

    position = 0;
    velocity = 0;

    gameRunning = true;

    gameOverText.style.display = "none";

    startMusic();

    createCactus();
}

/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    if (gameRunning) {
        updateDino();
    }

    requestAnimationFrame(gameLoop);
}

/* =========================
   START GAME
========================= */

createCactus();
gameLoop();

</script>

</body>
</html>
